<!doctype html>
<html class="h-full" lang="en">

    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/crm/images/tiberbu-mark.svg"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/crm/manifest/apple-icon-180.png"
    />
    <title>Tiberbu Customer Experience — Facility onboarding</title>
    <script>
      window.csrf_token = {{ (csrf_token or '') | tojson }};

  <body class="h-full">
